[package]
name = "tutorlolv2_wiki"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
heck = "0.5.0"
image = { version = "0.25.8", optional = true }
mlua = {
  version = "0.11.6",
  features = [
    "async",
    "lua54",
    "serde",
    "vendored",
  ]
}
ravif = { version = "0.12.0", default-features = false, optional = true }
rayon = "1.12.0"
regex = "1.12.3"
reqwest = {
  version = "0.13.2",
  features = ["default", "cookies", "gzip", "json"]
}
scraper = "0.26.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = {
  version = "1.52.1",
  default-features = false,
  features = ["macros", "rt-multi-thread"]
}
tutorlolv2_types = { path = "../tutorlolv2_types", features = ["dev"] }

[features]
default = []
avif = ["dep:image", "dep:ravif"]
