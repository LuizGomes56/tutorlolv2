[package]
name = "tutorlolv2_wiki"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
heck = "0.5.0"
image = { version = "0.25.10", optional = true }
mlua = { version = "0.12", features = [
    "async",
    "lua54",
    "serde",
    "vendored",
] }
ravif = { version = "0.13.0", default-features = false, optional = true }
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = [
    "default",
    "cookies",
    "gzip",
    "json",
] }
scraper = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }
tutorlolv2_types = { path = "../tutorlolv2_types", default-features = false }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[features]
default = []
avif = ["dep:image", "dep:ravif"]
