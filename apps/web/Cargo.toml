[package]
name = "web"
version = "0.2.4"
edition.workspace = true
repository.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.23.1"
bincode = { workspace = true, default-features = true }
derive_more = { version = "2.1.1", features = ["deref", "deref_mut"] }
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }
implicit-clone = "0.6.0"
pastey = { workspace = true }
serde_json = { workspace = true, default-features = true }
self_cell = "1"
serde = { workspace = true, features = ["derive"], default-features = true }
api = { workspace = true }
brotli = { workspace = true }
protocol = { workspace = true }
strum = { workspace = true, features = ["derive"], default-features = true }
math = { workspace = true, default-features = false, features = ["client"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["ReadableStream", "ReadableStreamDefaultReader", "Headers", "Request", "RequestInit", "RequestCredentials", "Response", "Window", "AbortController", "AbortSignal", "HtmlInputElement", "Navigator", "Clipboard"] }
yew = { workspace = true, features = ["csr"], default-features = true }
yew-router = "0.20.0"

[features]
default = ["local-calculation"]
local-calculation = ["math/engine"]
tauri = []
