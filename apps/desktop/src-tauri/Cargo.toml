[package]
name = "desktop"
version = "0.2.0"
description = "Tutorlolv2 desktop app with support to overlay"
repository.workspace = true
edition.workspace = true

[lib]
name = "desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[target.'cfg(windows)'.dependencies]
log = "0.4"
serde = { workspace = true, features = ["derive"], default-features = true }
serde_json = { workspace = true, default-features = true }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-http = { version = "2.8.3", default-features = false, features = [
    "http2",
    "rustls-tls",
] }
tauri-plugin-log = "2.10.1"
protocol = { workspace = true }
api = { workspace = true }
bincode = { workspace = true, default-features = true }
brotli = { workspace = true }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tokio = { workspace = true, features = ["time", "sync", "fs", "macros"], default-features = true }


windows = { version = "0.62.2", features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Memory",
] }
