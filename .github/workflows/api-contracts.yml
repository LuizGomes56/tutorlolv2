name: API contracts

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      # The scanner and protocol checks do not need the private local game-data cache or a database.
      - name: Check generated contracts are current
        run: cargo run --locked -p api_codegen -- check
      - name: Check declaration grammar and registered route inventory
        run: cargo test --locked -p api_codegen
      - name: Check common response and transport protocol
        run: cargo test --locked -p protocol --no-default-features
