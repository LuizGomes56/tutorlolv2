name: Rust shared crates

on:
  push:
  pull_request:

jobs:
  shared-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test shared libraries and benchmark launcher
        run: cargo test --locked -p types -p codec -p perf_runner
      - name: Test wiki library
        run: cargo test --locked -p wiki --lib
