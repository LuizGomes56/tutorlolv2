[package]
name = "tutorlolv2_build"
version = "0.4.1"
edition = "2024"

[dependencies]
rayon = "1.11.0"
regex = "1.11.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
symb_anafis = "0.8.1"
tutorlolv2_dev = { path = "../tutorlolv2_dev" }
tutorlolv2_fmt = { path = "../tutorlolv2_fmt" }
tutorlolv2_types = { path = "../tutorlolv2_types", features = ["dev"] }

[profile.release]
opt-level = 3
debug = false
strip = true
lto = true
panic = "abort"
incremental = false
codegen-units = 1
