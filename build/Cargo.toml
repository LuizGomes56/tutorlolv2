[package]
name = "tutorlolv2_build_dep"
version = "0.1.1"
edition = "2024"

[dependencies]
databake = "0.2.1"
derive_more = { version = "2.1.1", features = ["deref", "deref_mut"] }
heck = "0.5.0"
pastey = "0.2.3"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
rand = { version = "0.10.3", default-features = false }
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
symb_anafis = "0.8.1"
syn = { version = "2.0", features = ["full", "visit-mut"] }
tutorlolv2_codec = { path = "../tutorlolv2_codec" }
tutorlolv2_types = { path = "../tutorlolv2_types", features = ["bake", "dev"] }
tutorlolv2_wiki = { path = "../tutorlolv2_wiki" }
