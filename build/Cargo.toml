[package]
name = "tutorlolv2_build_dep"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "2.0.1"
brotli = "8.0.2"
const_sized_bit_set = { version = "0.5.0", default-features = false }
derive_more = { version = "2.1.1", features = ["full"] }
heck = "0.5.0"
pastey = "0.2.1"
phf = { version = "0.13.1", features = ["macros"] }
rand = "0.10.1"
rayon = "1.11.0"
regex = "1.11.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
serde_with = "3.21.0"
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
symb_anafis = "0.8.1"
synoptic = "2.2.9"
tutorlolv2_types = { path = "../tutorlolv2_types", features = ["dev"] }
tutorlolv2_wiki = { path = "../tutorlolv2_wiki" }
tutorlolv2_codec = { path = "../tutorlolv2_codec" }
