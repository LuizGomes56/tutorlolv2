[package]
name = "tutorlolv2_server"
version = "0.1.4"
edition = "2024"

[dependencies]
actix-cors = "0.7.2"
actix-files = "0.6.10"
actix-web = { version = "4.17.0", default-features = false, features = [
    "http2",
    "macros",
] }
bincode = "2.0.1"
brotli-decompressor = "6.2.0"
# sqlx = { version = "0.8.6", features = [
#     "runtime-tokio-rustls",
#     "postgres",
#     "macros",
# ], default-features = false }
dotenvy = "0.15.7"
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread"] }
tutorlolv2 = { path = "../", default-features = false, features = ["engine"] }

# The build script renders the formula docs of every champion, item and rune
[build-dependencies]
brotli = "9.1.1"
rayon = "1.12.0"
strum = "0.28.0"
tutorlolv2 = { path = "../", default-features = false, features = ["formula-docs"] }
