[package]
name = "tutorlolv2_server"
version = "0.1.4"
edition = "2024"

[dependencies]
tutorlolv2_types = { path = "../tutorlolv2_types", default-features = false }
actix-cors = "0.7.2"
actix-files = "0.7"
actix-web = { version = "4.18.1", default-features = false, features = [
    "http2",
    "macros",
] }
bincode = "2.0.1"
brotli-decompressor = "6.2.0"
dotenvy = "0.15.7"
serde_json = "1"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
tutorlolv2 = { path = "../", default-features = false, features = ["engine"] }
tutorlolv2_protocol = { path = "../tutorlolv2_protocol", features = ["sqlx"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "postgres",
    "macros",
    "sqlx-toml",
    "migrate",
    "uuid",
    "chrono",
] }
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.11"
subtle = "2"
base64 = "0.22.1"
getrandom = "0.4"
brotli = "9.1.1"
actix-governor = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
actix-http = "3"
wiremock = "0.6"

# The build script renders the formula docs of every champion, item and rune
[build-dependencies]
brotli = "9.1.1"
rayon = "1.12.0"
strum = "0.28.0"
tutorlolv2 = { path = "../", default-features = false, features = ["formula-docs"] }
