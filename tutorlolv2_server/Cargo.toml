[package]
name = "tutorlolv2_server"
version = "0.1.3"
edition = "2024"

[dependencies]
actix-cors = "0.7.1"
actix-files = "0.6.10"
actix-web = {
  version = "4.13.0",
  default-features = false,
  features = [
    "http2",
    "macros",
  ]
}
bincode = "2.0.1"
# sqlx = { version = "0.8.6", features = [
#     "runtime-tokio-rustls",
#     "postgres",
#     "macros",
# ], default-features = false }
dotenvy = "0.15.7"
pastey = "0.2.1"
rand = "0.10.0"
rust-embed = { version = "8.7.2", default-features = false }
serde_json = "1.0.149"
tokio = { version = "1.51.0", features = ["full"] }
tutorlolv2 = { path = "../" }

[profile.release]
opt-level = 3
debug = false
strip = true
lto = true
panic = "abort"
incremental = false
codegen-units = 1
