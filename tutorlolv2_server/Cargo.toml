[package]
name = "tutorlolv2_server"
version = "0.1.3"
edition = "2024"

[dependencies]
actix-cors = "0.7.2"
actix-files = "0.6.10"
actix-web = { version = "4.17.0", default-features = false, features = [
    "http2",
    "macros",
] }
bincode = "2.0.1"
# sqlx = { version = "0.8.6", features = [
#     "runtime-tokio-rustls",
#     "postgres",
#     "macros",
# ], default-features = false }
dotenvy = "0.15.7"
pastey = "0.2.3"
rust-embed = { version = "8.13.0", default-features = false }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread"] }
tutorlolv2 = { path = "../", default-features = false }
