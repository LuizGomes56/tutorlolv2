[package]
name = "tutorlolv2_cli"
version = "0.1.1"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
dotenvy = "0.15.7"
tokio = {
  version = "1.49.0",
  default-features = false,
  features = [
    "macros",
    "rt-multi-thread",
  ]
}
tutorlolv2_dev = { path = "../tutorlolv2_dev" }
tutorlolv2_html = { path = "../tutorlolv2_html" }
tutorlolv2_wiki = { path = "../tutorlolv2_wiki" }
# tutorlolv2_server = { path = "../tutorlolv2_server" }
