[package]
name = "build"
autobins = false
default-run = "generate"
version = "0.2.0"
edition.workspace = true

[dependencies]
databake = { workspace = true }
derive_more = { version = "2.1.1", features = ["deref", "deref_mut"] }
heck = { workspace = true }
lazy-regex = { workspace = true }
pastey = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote = { workspace = true }
rand = { version = "0.10.3", default-features = false }
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"], default-features = true }
serde_json = { workspace = true, default-features = true }
serde_with = "3.24.0"
strum = { workspace = true, features = ["derive", "strum_macros"], default-features = true }
syn = { workspace = true, features = ["full", "visit-mut"] }
codec = { workspace = true }
types = { workspace = true, features = ["bake", "dev"], default-features = true }
wiki = { workspace = true }

[[bin]]
name = "generate"
path = "src/main.rs"
