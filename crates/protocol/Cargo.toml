[package]
name = "protocol"
version = "0.1.0"
edition.workspace = true
description = "Types and rules shared by the TutorLoL desktop app, server and web app for game recording and sharing"

[dependencies]
types = { workspace = true, default-features = false }
bincode = { workspace = true, default-features = false, features = ["alloc", "derive"] }
serde = { workspace = true, default-features = false, features = ["alloc", "derive"] }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
sha2 = { workspace = true, default-features = false }
sqlx = { workspace = true, default-features = false, features = ["postgres", "derive"], optional = true }

[features]
default = []
std = []
sqlx = ["dep:sqlx", "std"]
