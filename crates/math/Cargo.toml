[package]
name = "math"
version = "0.10.0"
edition.workspace = true
repository.workspace = true
description = "League of Legends static library that evaluates damages of abilities, passives, items, and runes"

[dependencies]
bincode = { workspace = true, default-features = false, features = ["alloc", "derive"] }
const_sized_bit_set = { version = "0.5.0", default-features = false }
pastey = { workspace = true }
phf = { version = "0.14", default-features = false, features = ["macros"] }
serde = { workspace = true, default-features = false, features = ["alloc", "derive"] }
strum = { workspace = true, default-features = false, features = ["derive"] }
codec = { workspace = true, optional = true }
types = { workspace = true, default-features = false }
yew = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
serde_json = { workspace = true, default-features = true }

[build-dependencies]
build = { workspace = true }

[features]
default = ["engine", "formula-docs", "yew"]
engine = []
client = ["formula-docs", "yew"]
# Highlighted formula docs in any `codec::Markup`. Does not require yew.
formula-docs = ["dep:codec"]
# Client metadata (ability merge data, context identifiers, stack exceptions). Does not require yew.
client-data = []
yew = ["dep:yew", "client-data", "types/dev", "types/yew"]

