[package]
name = "api"
version = "0.1.0"
edition.workspace = true

[dependencies]
protocol = { workspace = true }
types = { workspace = true, default-features = false }
math = { workspace = true, default-features = false }
bincode = { workspace = true, default-features = false, features = ["alloc", "derive", "serde"] }
serde = { workspace = true, default-features = false, features = ["alloc", "derive"] }
serde_urlencoded = "0.7"
uuid = { workspace = true, default-features = false, features = ["serde"] }

[build-dependencies]
api_codegen = { workspace = true }
