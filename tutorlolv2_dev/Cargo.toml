[package]
name = "tutorlolv2_dev"
version = "0.3.0"
edition = "2024"

[dependencies]
chromiumoxide = "0.9.1"
futures = "0.3.32"
mlua = { version = "0.11.6", features = [
  "async",
  "lua54",
  "mlua_derive",
  "serde",
  "vendored",
] }
pastey = "0.2.1"
rand = "0.10.1"
rayon = "1.11.0"
regex = "1.11.2"
reqwest = { version = "0.12.1", features = ["json"] }
scraper = "0.25.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
serde_with = "3.19.0"
tokio = { version = "1.49.0", default-features = false, features = [
  "fs",
  "full",
  "process"
] }
tutorlolv2_fmt = { path = "../tutorlolv2_fmt" }
tutorlolv2_types = { path = "../tutorlolv2_types", features = ["dev"] }
tutorlolv2_wiki = { path = "../tutorlolv2_wiki" }
