[workspace]
resolver = "3"
members = [
    "crates/api",
    "crates/api_codegen",
    "crates/build",
    "crates/codec",
    "crates/math",
    "crates/perf",
    "crates/perf/runner",
    "crates/protocol",
    "crates/server",
    "crates/types",
    "crates/wiki",
]
default-members = ["crates/math"]

[workspace.package]
edition = "2024"
repository = "https://github.com/LuizGomes56/tutorlolv2"

[workspace.dependencies]
api = { path = "crates/api" }
api_codegen = { path = "crates/api_codegen" }
build = { path = "crates/build" }
codec = { path = "crates/codec" }
math = { path = "crates/math", default-features = false }
protocol = { path = "crates/protocol" }
types = { path = "crates/types", default-features = false }
wiki = { path = "crates/wiki" }

# Versions are shared; each member selects its own features.
bincode = { version = "2.0.1", default-features = false }
brotli = { version = "9.1.1" }
clap = { version = "4.6.0" }
databake = { version = "0.2.1" }
heck = { version = "0.5.0" }
lazy-regex = { version = "3.6.2" }
pastey = { version = "0.2.3" }
proc-macro2 = { version = "1.0" }
quote = { version = "1.0" }
rayon = { version = "1.12.0" }
regex = { version = "1.13.1" }
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0.154", default-features = false }
sha2 = { version = "0.11", default-features = false }
sqlx = { version = "0.9.0", default-features = false }
strum = { version = "0.28.0", default-features = false }
syn = { version = "3.0" }
tokio = { version = "1.54.1", default-features = false }
uuid = { version = "1", default-features = false }
yew = { version = "0.23.0", default-features = false }

# Optimize the final binaries across the entire workspace.
[profile.release]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1

# The AVIF encoder is ~25x slower without optimizations, so keep it optimized
# even when `wiki` is run through the dev profile
[profile.dev.package.rav1e]
opt-level = 3

[profile.dev.package.ravif]
opt-level = 3

# Keep the benchmark launcher on the same optimized settings as release builds.
[profile.perf]
inherits = "release"

