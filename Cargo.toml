[package]
name = "tutorlolv2"
version = "0.7.2"
edition = "2024"
authors = ["Luiz Gustavo Santana Dias Gomes"]
repository = "https://github.com/LuizGomes56/tutorlolv2"
description = "League of Legends static library that evaluates damages of abilities, passives, items, and runes"

[workspace]
members = [
  "tutorlolv2_avif",
  "tutorlolv2_cli",
  "tutorlolv2_fmt",
  "tutorlolv2_html",
  "tutorlolv2_server",
  "tutorlolv2_types",
  "tutorlolv2_wiki/"
]

[dependencies]
bincode = {
  version = "2.0.1",
  default-features = false,
  features = [
    "alloc",
    "derive",
  ]
}
const_sized_bit_set = "0.5.0"
pastey = "0.2.1"
phf = { version = "0.13.1", default-features = false, features = ["macros"] }
serde = {
  version = "1.0",
  default-features = false,
  features = [
    "alloc",
    "derive",
  ]
}
serde_arrays = { version = "0.2.0", default-features = false }
tutorlolv2_types = { path = "tutorlolv2_types", default-features = false }
yew = { version = "0.22.0", default-features = false, optional = true }

[build-dependencies]
tutorlolv2_build_dep = { path = "build" }

[features]
default = []
docs = []
yew = ["dep:yew"]
