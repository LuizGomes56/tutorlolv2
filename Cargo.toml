[package]
name = "tutorlolv2"
version = "0.10.0"
edition = "2024"
repository = "https://github.com/LuizGomes56/tutorlolv2"
description = "League of Legends static library that evaluates damages of abilities, passives, items, and runes"

[workspace]
members = [
    "tutorlolv2_api",
    "tutorlolv2_api_codegen",
    "perf",
    "perf/runner",
    "tutorlolv2_codec",
    "tutorlolv2_protocol",
    "tutorlolv2_server",
    "tutorlolv2_types",
    "tutorlolv2_wiki",
]

[dependencies]
bincode = { version = "2.0.1", default-features = false, features = [
    "alloc",
    "derive",
] }
const_sized_bit_set = { version = "0.5.0", default-features = false }
pastey = "0.2.3"
phf = { version = "0.14", default-features = false, features = ["macros"] }
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
tutorlolv2_codec = { path = "tutorlolv2_codec", optional = true }
tutorlolv2_types = { path = "tutorlolv2_types", default-features = false }
yew = { version = "0.23.0", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1.0"

[build-dependencies]
tutorlolv2_build_dep = { path = "build" }

[features]
default = ["engine", "formula-docs", "yew"]
engine = []
client = ["formula-docs", "yew"]
# Highlighted formula docs in any `tutorlolv2_codec::Markup`. Does not require yew.
formula-docs = ["dep:tutorlolv2_codec"]
# Client metadata (ability merge data, context identifiers, stack exceptions). Does not require yew.
client-data = []
yew = ["dep:yew", "client-data", "tutorlolv2_types/dev", "tutorlolv2_types/yew"]

# Optimize the final binaries across the entire workspace.
[profile.release]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1

# The AVIF encoder is ~25x slower without optimizations, so keep it optimized
# even when `tutorlolv2_wiki` is run through the dev profile
[profile.dev.package.rav1e]
opt-level = 3

[profile.dev.package.ravif]
opt-level = 3

# Keep the benchmark launcher on the same optimized settings as release builds.
[profile.perf]
inherits = "release"

