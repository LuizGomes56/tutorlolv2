[package]
name = "tutorlolv2"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/LuizGomes56/tutorlolv2_native"
description = ""

[dependencies]
bincode = { version = "2.0.1", default-features = false, features = [
    "alloc",
    "derive",
] }
gpui = "0.2.2"
rust-embed = "8"
# The library lives in WSL; these paths are for the Windows toolchain.
tutorlolv2 = { path = '\\wsl.localhost\Ubuntu\home\luizg\Projects\tutorlolv2', default-features = false, features = ["formula-docs"] }
tutorlolv2_codec = { path = '\\wsl.localhost\Ubuntu\home\luizg\Projects\tutorlolv2\tutorlolv2_codec' }
unicode-segmentation = "1"
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
