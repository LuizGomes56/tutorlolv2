[package]
name = "tutorlolv2_tuple_bench"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
new = { package = "tutorlolv2_nightly", path = "..", default-features = false, features = ["engine"] }
serde_json = "1.0"
strum = "0.28.0"

[build-dependencies]
tutorlolv2_nightly_build = { path = "../build" }
regex = "1.13.1"
syn = { version = "3.0", features = ["full"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
