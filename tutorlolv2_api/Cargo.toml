[package]
name = "tutorlolv2_api"
version = "0.1.0"
edition = "2024"

[dependencies]
tutorlolv2_protocol = { path = "../tutorlolv2_protocol" }
tutorlolv2_types = { path = "../tutorlolv2_types", default-features = false }
tutorlolv2 = { path = "..", default-features = false }
bincode = { version = "2.0.1", default-features = false, features = ["alloc", "derive"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_urlencoded = "0.7"
uuid = { version = "1", default-features = false, features = ["serde"] }
